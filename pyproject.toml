[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "maimai-cli"
version = "0.1.0"
description = "Off-device 脉脉 (com.taou.maimai) API client — pure Python, no per-request signature"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "weixingyu" }]
keywords = ["maimai", "taou", "reverse-engineering", "cli"]
dependencies = [
    "requests>=2.28",
]

[project.optional-dependencies]
# MCP server (python -m maimaicli.mcp_server)
mcp = ["mcp>=1.2"]
# password-login RSA (mm login --password); SMS-code login needs none of this
login = ["pycryptodome>=3.20"]

[project.scripts]
mm = "maimaicli.cli:main"
mm-mcp = "maimaicli.mcp_server:main"

[project.urls]
Homepage = "https://github.com/1013503897/maimai-cli"

[tool.setuptools]
packages = ["maimaicli"]
